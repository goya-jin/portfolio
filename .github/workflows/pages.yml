name: Build and deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/editor.test.mjs tests/freshness.test.mjs
      - run: node --check admin/editor.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-writing.txt
      - run: python scripts/build_writing.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir _site
          cp *.html *.css *.js site-version.json _site/
          cp -R assets writing admin _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        id: upload
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy uploaded artifact by ID
        uses: actions/github-script@v7
        id: deployment
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            await require('./scripts/deploy-pages.cjs')({
              github, context, core, artifactId: process.env.PAGES_ARTIFACT_ID
            });
